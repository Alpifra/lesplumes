name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target server
        type: choice
        options: [staging, production]
        default: staging

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy (${{ inputs.environment || 'production' }})
    needs: ci
    runs-on: ubuntu-latest
    # Secrets and variables are read from this GitHub environment
    environment: ${{ inputs.environment || 'production' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false

    env:
      # Laravel folder; the domain's document root points to its public/ subfolder
      APP_PATH: ${{ vars.APP_PATH }}
      # On Infomaniak, plain `php` is an older version: each one lives in /opt/phpX.Y
      PHP_BIN: ${{ vars.PHP_BIN || '/opt/php8.5/bin/php' }}

    steps:
      - uses: actions/checkout@v4

      # —— Build ————————————————————————————————————————————————————————————
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, gd, zip, fileinfo
          coverage: none

      - name: Install Composer dependencies (no dev)
        working-directory: laravel-app
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue-app/package-lock.json

      - name: Build the Vue app
        working-directory: vue-app
        env:
          VITE_APPLICATION_NAME: ${{ vars.VITE_APPLICATION_NAME }}
          VITE_APPLICATION_ENDPOINT: ${{ vars.VITE_APPLICATION_ENDPOINT }}
          VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
        run: |
          npm ci
          npm run build-only

      # API and front share the same document root: Laravel's public/
      - name: Put the Vue app in Laravel's public folder
        run: cp -R vue-app/dist/. laravel-app/public/

      # —— SSH ——————————————————————————————————————————————————————————————
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Check the server is ready
        run: |
          ssh server true \
            || { echo "::error::Cannot connect over SSH, check SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS"; exit 1; }
          ssh server "test -f '$APP_PATH/.env'" \
            || { echo "::error::$APP_PATH/.env is missing on the server, create it first"; exit 1; }
          # Checked before uploading: vendor/ built for 8.5 breaks the site on an older PHP
          ssh server "$PHP_BIN -r 'exit(PHP_VERSION_ID >= 80500 ? 0 : 1);'" \
            || { echo "::error::$PHP_BIN is missing or older than PHP 8.5 on the server, set the PHP_BIN variable"; exit 1; }

      # —— Deploy ———————————————————————————————————————————————————————————
      - name: Put the API in maintenance mode
        id: maintenance
        # artisan is missing on the very first deploy
        run: ssh server "cd '$APP_PATH' && $PHP_BIN artisan down --retry=15 || true"

      # .env and storage/ (uploaded texts, logs, sessions) live on the server only
      - name: Upload the app
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            --exclude='/tests/' \
            --exclude='/phpunit.xml' \
            --exclude='/phpstan.neon' \
            --exclude='/.phpunit*' \
            --exclude='/node_modules/' \
            laravel-app/ "server:$APP_PATH/"

      - name: Migrate and cache
        run: |
          ssh server sh -se <<EOF
            cd '$APP_PATH'
            mkdir -p storage/app/public storage/app/uploads \
              storage/framework/cache/data storage/framework/sessions storage/framework/views \
              storage/logs
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan storage:link || true
            $PHP_BIN artisan optimize
          EOF

      # Also runs when a step above failed, so the site never stays down
      - name: Leave maintenance mode
        if: always() && steps.maintenance.outcome == 'success'
        run: ssh server "cd '$APP_PATH' && $PHP_BIN artisan up"
