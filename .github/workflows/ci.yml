name: CI

on:
  pull_request:
  push:
    # master is tested by the deploy workflow, which calls this one first
    branches-ignore: [master]
  workflow_call:

jobs:
  backend:
    name: Laravel (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-app

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, gd, zip, fileinfo
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('laravel-app/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.test .env

      # The API and console tests share a persistent database (no RefreshDatabase),
      # so the schema must exist before the first of them runs
      - run: php artisan migrate --force

      - run: php artisan test

  frontend:
    name: Vue (type-check, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue-app/package-lock.json

      - run: npm ci

      - run: npx vitest run

      # type-check + vite build
      - run: npm run build
